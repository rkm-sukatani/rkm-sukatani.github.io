<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="150" y1="80" x2="362" y2="440">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Latar: squircle hijau (palet situs) -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Gundukan tanah makam -->
  <path d="M96 444 Q256 404 416 444 L416 452 Q416 460 408 460 L104 460 Q96 460 96 452 Z" fill="#34d399" opacity="0.35"/>

  <!-- Alas / kaki nisan (dua undakan) -->
  <rect x="140" y="404" width="232" height="34" rx="8" fill="url(#gold)"/>
  <rect x="160" y="384" width="192" height="28" rx="6" fill="url(#gold)"/>

  <!-- Badan batu nisan: tegak dengan puncak lengkung runcing (keel arch) -->
  <path d="M178 392 L178 214 C178 164 222 136 256 86 C290 136 334 164 334 214 L334 392 Z" fill="url(#gold)"/>

  <!-- Panel ukiran tipis di badan nisan -->
  <path d="M202 372 L202 222 C202 186 232 162 256 128 C280 162 310 186 310 222 L310 372 Z" fill="none" stroke="#064e3b" stroke-opacity="0.28" stroke-width="7"/>

  <!-- Aksen bulan sabit -->
  <circle cx="256" cy="246" r="38" fill="#064e3b"/>
  <circle cx="273" cy="234" r="32" fill="url(#gold)"/>

  <!-- Garis ukir horizontal -->
  <rect x="218" y="318" width="76" height="9" rx="4.5" fill="#064e3b" fill-opacity="0.45"/>
  <rect x="230" y="340" width="52" height="9" rx="4.5" fill="#064e3b" fill-opacity="0.45"/>
</svg>
